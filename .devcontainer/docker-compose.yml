services:
  nginx:
      image: docker.io/library/nginx:1.31.2-trixie-perl
      container_name: tiny_lang_nginx_dev
      restart: unless-stopped
      networks:
        - tiny_lang_network_dev
      ports:
        - "8080:80"
        - "8081:81"
      volumes:
       - ./nginx.conf:/etc/nginx/nginx.conf:ro
      depends_on:
        - app

  app:
    image: mcr.microsoft.com/dotnet/sdk:10.0.301
    container_name: tiny_lang_app_dev
    command: sleep infinity
    networks:
      - tiny_lang_network_dev
    volumes:
      - ..:/workspace:cached
    depends_on:
      - postgres
      - redis
      - rabbitmq

  postgres:
    image: docker.io/library/postgres:18.4-trixie
    container_name: tiny_lang_db_dev
    restart: unless-stopped
    networks:
      - tiny_lang_network_dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: SbFHQ1z9aK4=
      POSTGRES_DB: tiny_lang

  redis:
    image: docker.io/library/redis:8.8.0-trixie
    container_name: tiny_lang_redis_dev
    restart: unless-stopped
    networks:
      - tiny_lang_network_dev

  rabbitmq:
    image: docker.io/library/rabbitmq:4.3.2-management-alpine
    container_name: tiny_lang_mq_dev
    restart: unless-stopped
    networks:
      - tiny_lang_network_dev
    ports:
      - "15673:15672"

networks:
  tiny_lang_network_dev:
    driver: bridge
